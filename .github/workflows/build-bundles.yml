name: Build Desktop Bundles

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
          - platform: linux
            os: ubuntu-22.04

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      - name: Install frontend deps
        run: npm install

      - name: Resolve macOS signing mode
        if: matrix.platform == 'macos'
        id: mac_signing
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          mode="adhoc"
          reason="missing-secrets"

          if [ -n "${APPLE_SIGNING_IDENTITY}" ] && [ -n "${APPLE_CERTIFICATE}" ] && [ -n "${APPLE_CERTIFICATE_PASSWORD}" ]; then
            cert_file="$(mktemp /tmp/pawdio-cert.XXXXXX.p12)"
            if printf '%s' "${APPLE_CERTIFICATE}" | base64 --decode > "${cert_file}" 2>/dev/null || printf '%s' "${APPLE_CERTIFICATE}" | base64 -D > "${cert_file}" 2>/dev/null; then
              if openssl pkcs12 -in "${cert_file}" -nokeys -passin "pass:${APPLE_CERTIFICATE_PASSWORD}" >/dev/null 2>&1; then
                mode="signed"
                reason="certificate-valid"
              else
                reason="certificate-password-or-format-invalid"
              fi
            else
              reason="certificate-not-base64"
            fi
            rm -f "${cert_file}"
          fi

          if [ "${mode}" != "signed" ] && [ "${reason}" != "missing-secrets" ]; then
            echo "::warning::Falling back to ad-hoc mac signing (${reason}). Check APPLE_CERTIFICATE and APPLE_CERTIFICATE_PASSWORD."
          fi

          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          echo "reason=${reason}" >> "${GITHUB_OUTPUT}"

      - name: Build Tauri bundle (macOS signed/notarized)
        if: matrix.platform == 'macos' && steps.mac_signing.outputs.mode == 'signed'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri build

      - name: Build Tauri bundle (macOS ad-hoc fallback)
        if: matrix.platform == 'macos' && steps.mac_signing.outputs.mode != 'signed'
        shell: bash
        run: |
          set -euo pipefail
          npm run tauri build -- --config '{"bundle":{"macOS":{"entitlements":null,"signingIdentity":null}}}'

      - name: Build Tauri bundle (Windows/Linux)
        if: matrix.platform != 'macos'
        run: npm run tauri build

      - name: Upload downloadable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pawdio-${{ matrix.platform }}-bundle
          if-no-files-found: error
          path: src-tauri/target/release/bundle/**
