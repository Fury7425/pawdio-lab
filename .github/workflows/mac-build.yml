name: macOS App Build (Enhanced)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Upgrade pip
      run: python -m pip install --upgrade pip

    - name: Install PortAudio (required for PyAudio/audio core)
      run: |
        brew update
        brew install portaudio create-dmg

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Install build tools
      run: pip install pyinstaller

    # Build .icns from your 192x192 PNG at app/ui/assets/pawdiolab.png
    - name: Generate .icns from PNG
      run: |
        ICON_PNG="app/ui/assets/pawdiolab.png"
        ICONSET_DIR="app/ui/assets/pawdiolab.iconset"
        ICNS_OUT="app/ui/assets/pawdiolab.icns"

        if [ ! -f "$ICON_PNG" ]; then
          echo "Icon PNG not found at $ICON_PNG"
          exit 1
        fi

        mkdir -p "$ICONSET_DIR"

        # good downsizes from 192x192
        sips -z 16 16     "$ICON_PNG" --out "$ICONSET_DIR/icon_16x16.png"
        sips -z 32 32     "$ICON_PNG" --out "$ICONSET_DIR/icon_16x16@2x.png"
        sips -z 32 32     "$ICON_PNG" --out "$ICONSET_DIR/icon_32x32.png"
        sips -z 64 64     "$ICON_PNG" --out "$ICONSET_DIR/icon_32x32@2x.png"
        sips -z 128 128   "$ICON_PNG" --out "$ICONSET_DIR/icon_128x128.png"
        sips -z 256 256   "$ICON_PNG" --out "$ICONSET_DIR/icon_128x128@2x.png"

        # upscaled but ok
        sips -z 256 256   "$ICON_PNG" --out "$ICONSET_DIR/icon_256x256.png"
        sips -z 512 512   "$ICON_PNG" --out "$ICONSET_DIR/icon_256x256@2x.png"

        iconutil -c icns "$ICONSET_DIR" -o "$ICNS_OUT"

    - name: Build macOS .app bundle
      run: |
        pyinstaller app/main.py \
          --name "Pawdio Lab" \
          --windowed \
          --clean \
          --icon app/ui/assets/pawdiolab.icns \
          --add-data "app/ui/assets/pawdiolab.icns:app/ui/assets" \
          --add-data "app/ui/assets/pawdiolab.png:app/ui/assets" \
          --collect-all customtkinter \
          --hidden-import "customtkinter" \
          --hidden-import "matplotlib.backends.backend_tkagg" \
          --hidden-import "tkinter"

        mkdir -p dist_upload
        mv "dist/Pawdio Lab.app" dist_upload/

    - name: Create DMG installer
      run: |
        mkdir -p dmg_src
        cp -R "dist_upload/Pawdio Lab.app" dmg_src/

        create-dmg \
          --volname "Pawdio Lab Installer" \
          --window-pos 200 120 \
          --window-size 600 400 \
          --icon-size 100 \
          --app-drop-link 425 150 \
          "Pawdio Lab.dmg" \
          "dmg_src"

        mv "Pawdio Lab.dmg" dist_upload/

    - name: Upload .app and .dmg
      uses: actions/upload-artifact@v4
      with:
        name: Pawdio-Lab-macOS
        path: dist_upload/*
