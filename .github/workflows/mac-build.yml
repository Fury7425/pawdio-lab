name: macOS App Build (Enhanced)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual running

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Upgrade pip
      run: python -m pip install --upgrade pip

    - name: Install PortAudio (required for PyAudio/audio core)
      run: |
        brew update
        brew install portaudio create-dmg  # install create-dmg as well

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Install build tools
      run: pip install pyinstaller

    - name: Build macOS .app bundle
      run: |
        pyinstaller app/main.py \
          --name "Pawdio Lab" \
          --windowed \
          --clean \
          --collect-all customtkinter \
          --hidden-import "customtkinter" \
          --hidden-import "matplotlib.backends.backend_tkagg" \
          --hidden-import "tkinter"

        mkdir -p dist_upload
        mv "dist/Pawdio Lab.app" dist_upload/

    - name: Create DMG installer
      run: |
        create-dmg \
          --volname "Pawdio Lab Installer" \
          --volicon "app/icon.icns" \  # optional: set app icon if you have one
          --window-pos 200 120 \
          --window-size 600 400 \
          --icon-size 100 \
          --app-drop-link 425 150 \
          "Pawdio Lab.dmg" \
          "dist_upload/Pawdio Lab.app"

        mv "Pawdio Lab.dmg" dist_upload/

    - name: Upload .app and .dmg
      uses: actions/upload-artifact@v4
      with:
        name: Pawdio-Lab-macOS
        path: dist_upload/*
