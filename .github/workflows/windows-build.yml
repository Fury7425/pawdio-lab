name: Build Windows EXE (PyInstaller)

on:
  push:
    branches: [ main, master ]
    tags:
      - "v*.*.*"
  pull_request:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --noconsole --name "Pawdio-Lab" -p app app/main.py
          dir dist

      - name: Compress EXE
        run: |
          Compress-Archive -Path dist/Pawdio-Lab.exe -DestinationPath dist/Pawdio-Lab.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pawdio-Lab-${{ github.sha }}
          path: dist/Pawdio-Lab.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: Pawdio-Lab-${{ github.sha }}
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Pawdio-Lab.zip
          draft: false
          prerelease: false