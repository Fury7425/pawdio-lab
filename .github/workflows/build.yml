name: Build Pawdio Lab

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
    - uses: actions/checkout@v2
    
    - name: Setup Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '18'

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable

    - name: Ensure PostCSS config uses CommonJS (Unix)
      if: runner.os != 'Windows'
      run: |
        if [ -f postcss.config.js ]; then
          mv postcss.config.js postcss.config.cjs
        fi

    - name: Ensure PostCSS config uses CommonJS (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if (Test-Path postcss.config.js) {
          Rename-Item postcss.config.js -NewName postcss.config.cjs -Force
        }

    - name: Install dependencies
      run: npm install

    - name: Build
      run: npm run tauri build
