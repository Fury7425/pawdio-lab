[package]
name = "pawdio-lab"
version = "1.0.0"
description = "Pawdio Lab desktop audio diagnostics"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cpal = "0.15"
num-complex = "0.4"
rand = "0.8"
rustfft = "6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "1"
tokio = { version = "1", features = ["sync"] }
plotters = "0.3"
