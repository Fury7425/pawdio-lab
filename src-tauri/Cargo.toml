[package]
name = "pawdio-lab"
version = "0.1.0"
description = "High-performance audio lab"
authors = ["Robin"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5" }

[dependencies]
tauri = { version = "1.5", features = ["shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cpal = "0.15"
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
log = "0.4"

[features]
default = []
custom-protocol = []
